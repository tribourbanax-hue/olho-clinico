<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Olho Clínico — Anatomia Visual</title>
<meta name="description" content="Jogo de memorização visual de anatomia: veja a parte do corpo e diga o nome.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
<style>:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2a37;--mut:#6b7280;--line:#e6e0d4;--ok:#22a06b;--bad:#e5484d;--acc:#2f6fdf;--gold:#f2b632;--sh:0 2px 0 rgba(0,0,0,.06),0 6px 18px rgba(31,42,55,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Segoe UI",Nunito,system-ui,sans-serif}
body{min-height:100vh;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top .voltar{background:var(--card);box-shadow:var(--sh);width:40px;height:40px;border-radius:12px;font-size:20px;flex:none}
.top h2{font-size:19px;flex:1;line-height:1.15}
.top .sub{font-size:13px;color:var(--mut);font-weight:600}
.hero{text-align:center;padding:18px 4px 8px}
.hero .logo{font-size:44px}
.hero h1{font-size:28px;letter-spacing:-.5px}
.hero p{margin:6px 0 0;color:var(--mut)}
.stats{display:flex;gap:8px;margin:14px 0}
.stat{flex:1;background:var(--card);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mut);font-weight:600}
.big{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:14px;margin:0 0 10px;box-shadow:var(--sh);transition:transform .1s}
.big:active{transform:scale(.98)}
.big .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.big b{display:block;font-size:17px}
.big small{color:var(--mut);font-size:13px}
.sec{font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sis{background:var(--card);border-radius:18px;padding:12px;text-align:left;box-shadow:var(--sh);border-bottom:4px solid var(--c)}
.sis .em{font-size:28px}
.sis b{display:block;font-size:15px;margin:4px 0 6px;line-height:1.15}
.barra{height:8px;background:#eee8dc;border-radius:9px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--c,var(--ok));border-radius:9px;transition:width .6s}
.sis small{display:block;margin-top:5px;color:var(--mut);font-size:12px;font-weight:600}
.reg{background:var(--card);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.reg .th{width:64px;height:64px;border-radius:12px;background:#fff center/contain no-repeat;flex:none;border:1px solid var(--line)}
.reg .info{flex:1;min-width:0}
.reg .info b{display:block}
.reg .info small{color:var(--mut);font-size:12px}
.reg .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pill{background:#eef3fd;color:var(--acc);font-weight:700;font-size:13px;padding:7px 11px;border-radius:10px}
.pill.alt{background:#fff4dc;color:#a86b00}
.cta{display:block;width:100%;background:var(--acc);color:#fff;font-weight:800;font-size:17px;padding:15px;border-radius:16px;box-shadow:0 4px 0 #1f4fa8;margin:6px 0 14px}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #1f4fa8}
.cta.verde{background:var(--ok);box-shadow:0 4px 0 #157a50}
/* palco (imagem com zoom) */
.palco{position:relative;width:100%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh);touch-action:none;user-select:none}
.palco img.fig{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.6,.05,.25,1);pointer-events:none;-webkit-user-drag:none}
.alvo{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:4px solid var(--bad);box-shadow:0 0 0 3px #fff,0 0 12px rgba(229,72,77,.6);transition:left .9s cubic-bezier(.6,.05,.25,1),top .9s cubic-bezier(.6,.05,.25,1),width .9s,height .9s,margin .9s;pointer-events:none;animation:pulsa 1.2s infinite}
.alvo.peq{width:20px;height:20px;margin:-10px 0 0 -10px;border-width:3px}
@keyframes pulsa{50%{box-shadow:0 0 0 3px #fff,0 0 0 10px rgba(229,72,77,.25)}}
.etq{position:absolute;transform:translate(-50%,-140%);background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:5px 9px;border-radius:9px;white-space:nowrap;opacity:0;transition:opacity .4s .7s;pointer-events:none}
.etq.on{opacity:1}
.cont{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);border-radius:10px;padding:4px 9px;font-size:12px;font-weight:800;color:var(--mut)}
.qtxt{text-align:center;font-weight:800;font-size:18px;margin:14px 0 10px}
.ops{display:grid;gap:9px}
.op{background:var(--card);border-radius:14px;padding:14px;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--line);border:2px solid var(--line);text-align:left;transition:transform .1s}
.op:active{transform:scale(.98)}
.op.ok{background:#e3f6ec;border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.op.bad{background:#fde8e8;border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:treme .35s}
.op[disabled]{cursor:default}
@keyframes treme{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dica{background:#fff8e6;border:2px solid #f6dd9c;border-radius:14px;padding:11px 13px;margin:12px 0 0;font-size:15px}
.dica b{display:block;margin-bottom:2px}
.prog{height:10px;background:#e8e2d5;border-radius:9px;overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .4s}
.combo{text-align:center;font-weight:800;color:#c47a00;min-height:22px;font-size:14px}
/* montar (arrastar) */
.ponto{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .2s,background .2s}
.ponto.ok{background:var(--ok);border-color:#fff;width:18px;height:18px;margin:-9px 0 0 -9px}
.ponto.mira{transform:scale(1.45);background:#ffe58a}
.ponto.erro{background:var(--bad);animation:treme .35s}
.tag{position:absolute;font-size:11px;font-weight:800;color:#fff;background:var(--ok);padding:2px 6px;border-radius:7px;white-space:nowrap;transform:translate(10px,-50%);pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tag.esq{transform:translate(calc(-100% - 10px),-50%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.chip{color:#fff;font-weight:800;font-size:15px;padding:11px 14px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:none;user-select:none}
.chip.sel{outline:4px solid var(--ink);outline-offset:2px;transform:translateY(-2px)}
.chip.fora{visibility:hidden}
.chip.bad{animation:treme .35s}
.fantasma{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-120%) scale(1.05);opacity:.95}
.hud{display:flex;justify-content:space-between;font-weight:800;color:var(--mut);font-size:14px;margin:0 2px 8px}
.hud b{color:var(--ink)}
.aviso{text-align:center;color:var(--mut);font-size:13px;margin-top:8px}
/* estudar */
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.lista{margin-top:12px;display:grid;gap:7px}
.li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:9px 11px;box-shadow:var(--sh);text-align:left}
.li .n{background:var(--acc);color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px}
.li b{display:block;font-size:15px}
.li small{color:var(--mut);font-size:13px}
.li.oculto b{color:transparent;background:#e8e2d5;border-radius:6px}
.li.ativo{outline:3px solid var(--gold)}
.toggle{display:flex;gap:8px;margin-top:10px}
.toggle button{flex:1;background:var(--card);padding:10px;border-radius:12px;font-weight:700;box-shadow:var(--sh)}
.toggle button.on{background:var(--ink);color:#fff}
/* resultado */
.res{text-align:center;padding:20px 6px}
.res .estrelas{font-size:46px;letter-spacing:6px;margin:6px 0}
.res h2{font-size:26px}
.res p{color:var(--mut);margin:6px 0 16px}
.errou{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);text-align:left;margin-bottom:14px}
.errou b{display:block;margin-bottom:6px}
.errou span{display:inline-block;background:#fde8e8;color:#b42318;font-weight:700;font-size:13px;padding:4px 8px;border-radius:8px;margin:0 4px 4px 0}
.timer{height:8px;background:#e8e2d5;border-radius:9px;overflow:hidden;margin-bottom:10px}
.timer i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
#confete{position:fixed;inset:0;pointer-events:none;z-index:60}
.rodape{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}
</style></head>

    for (const it of itens) { const p = pos(it.hot); it.el.style.left = p.x + "px"; it.el.style.top = p.y + "px"; }

    }
    tela(topo(titulo, `${i + 1} de ${lista.length}`, volta),
      h("div", { class: "prog" }, h("i", { style: `width:${(100 * i) / lista.length}%` })),
      pal.el, h("div", { class: "qtxt" }, p.osso ? "Que osso é esse?" : "Que parte é essa?"), comboEl,
      h("div", { class: "ops" }, btns), area);
    pal.montar(); pal.semAnim(() => pal.focar(p.hot));
  }
  function fim() {
    const pct = acertos / lista.length, est = pct === 1 ? 3 : pct >= 0.7 ? 2 : pct >= 0.4 ? 1 : 0;
    if (est >= 2) { bip("fim"); confete(); }
    tela(h("div", { class: "res" },
      h("div", { class: "estrelas" }, "⭐".repeat(est) + "☆".repeat(3 - est)),
      h("h2", {}, pct === 1 ? "Olho clínico!" : pct >= 0.7 ? "Mandou bem!" : "Bora fixar mais um pouco"),
      h("p", {}, `${acertos} de ${lista.length} certas · melhor sequência ${melhorCombo}`),
      erros.length ? h("div", { class: "errou" }, h("b", {}, "Para revisar:"), erros.map((p) => h("span", {}, p.nome))) : null,
      erros.length ? h("button", { class: "cta", onclick: () => rodada(embaralha(erros), "Revisando erros", volta) }, "🔁 Treinar só as que errei") : null,
      h("button", { class: "cta verde", onclick: () => rodada(escolhe(lista.length >= 10 ? PARTES.filter((p) => lista.some((l) => l.sis === p.sis)) : lista, lista.length), titulo, volta) }, "Jogar de novo"),
      h("button", { class: "big", style: "justify-content:center", onclick: volta }, "Voltar")));
  }
  pergunta();
}

// ---------- MONTE A LEGENDA (estilo arrastar e soltar) ----------
function montar(rk, volta, todos) {
  const r = REGIOES[rk], todas = PARTES.filter((p) => p.reg === rk);
  const MAX = 8, lista = todos || todas.length <= MAX ? todas : escolhe(todas, MAX);
  const pal = Palco(rk, alturaCheia);
  const cores = embaralha(CORES);
  const pontos = {}, feitos = new Set();
  lista.forEach((p) => (pontos[p.id] = pal.add(h("div", { class: "ponto" }), p.hot)));
  let erros = 0, sel = null, t0 = Date.now();
  const errosPorParte = new Set();
  const hudT = h("b", {}, "0s"), hudA = h("b", {}, `0/${lista.length}`), hudE = h("b", {}, "0");
  const chips = embaralha(lista).map((p, i) => {
    const c = h("div", { class: "chip", style: `background:${cores[i % cores.length]}` }, p.nome); c._p = p; return c;
  });
  // arrastar com o dedo (ou tocar no nome e depois no ponto)
  let arr = null, mira = null;
  const fantasma = (c) => { const g = c.cloneNode(true); g.classList.add("fantasma"); document.body.append(g); return g; };
  function miraEm(x, y) {
    const b = pal.el.getBoundingClientRect();
    const c = pal.maisPerto(x - b.left, y - b.top, lista.filter((p) => !feitos.has(p.id)));
    if (mira) pontos[mira.id].classList.remove("mira");
    mira = c; if (c) pontos[c.id].classList.add("mira");
  }
  chips.forEach((c) => {
    c.addEventListener("pointerdown", (ev) => {
      ev.preventDefault(); c.setPointerCapture(ev.pointerId);
      arr = { c, x0: ev.clientX, y0: ev.clientY, g: null };
    });
    c.addEventListener("pointermove", (ev) => {
      if (!arr || arr.c !== c) return;
      if (!arr.g && Math.hypot(ev.clientX - arr.x0, ev.clientY - arr.y0) > 8) { arr.g = fantasma(c); c.style.opacity = ".35"; }
      if (arr.g) { arr.g.style.left = ev.clientX + "px"; arr.g.style.top = ev.clientY + "px"; miraEm(ev.clientX, ev.clientY - 40); }
    });
    const solta = (ev) => {
      if (!arr || arr.c !== c) return;
      const a = arr; arr = null; c.style.opacity = "";
      if (a.g) { a.g.remove(); const m = mira; if (mira) pontos[mira.id].classList.remove("mira"); mira = null; if (m) tenta(c, m); else c.classList.add("bad"), setTimeout(() => c.classList.remove("bad"), 400); }
      else { if (sel === c) { c.classList.remove("sel"); sel = null; } else { if (sel) sel.classList.remove("sel"); sel = c; c.classList.add("sel"); } }
    };
    c.addEventListener("pointerup", solta); c.addEventListener("pointercancel", solta);
  });
  pal.el.addEventListener("click", (ev) => {
    if (!sel) return;
    const b = pal.el.getBoundingClientRect();
    const alvo = pal.maisPerto(ev.clientX - b.left, ev.clientY - b.top, lista.filter((p) => !feitos.has(p.id)));
    if (alvo) tenta(sel, alvo);
  });
  function tenta(c, alvo) {
    const p = c._p;
    if (alvo.id === p.id) {
      feitos.add(p.id); bip("ok");
      const pt = pontos[p.id]; pt.classList.add("ok");
      pal.add(h("div", { class: "tag" + (p.hot[0] > 55 ? " esq" : ""), style: `background:${c.style.background}` }, p.nome), p.hot);
      c.classList.add("fora"); c.classList.remove("sel"); if (sel === c) sel = null;
      if (!errosPorParte.has(p.id)) registra(p.id, true);
      hudA.textContent = `${feitos.size}/${lista.length}`;
      if (feitos.size === lista.length) setTimeout(fim, 700);
    } else {
      erros++; hudE.textContent = erros; bip("erro");
      if (!errosPorParte.has(p.id)) { errosPorParte.add(p.id); registra(p.id, false); }
      const pt = pontos[alvo.id]; pt.classList.add("erro"); setTimeout(() => pt.classList.remove("erro"), 450);
      c.classList.add("bad"); setTimeout(() => c.classList.remove("bad"), 400);
    }
  }
  function fim() {
    const t = Math.round((Date.now() - t0) / 1000), est = erros === 0 ? 3 : erros <= 2 ? 2 : 1;
    const k = "m:" + rk, b = E.best[k], recorde = !b || t < b.t && erros <= b.e || erros < b.e;
    if (recorde) { E.best[k] = { t, e: erros }; salvar(); }
    bip("fim"); if (est >= 2) confete();
    tela(h("div", { class: "res" },
      h("div", { class: "estrelas" }, "⭐".repeat(est) + "☆".repeat(3 - est)),
      h("h2", {}, erros === 0 ? "Legenda perfeita!" : "Legenda completa!"),
      h("p", {}, `${r.rotulo} · ${t}s · ${erros} erro${erros === 1 ? "" : "s"}${recorde ? " · 🏆 novo recorde!" : ""}`),
      errosPorParte.size ? h("div", { class: "errou" }, h("b", {}, "Você trocou:"), [...errosPorParte].map((id) => h("span", {}, P[id].nome))) : null,
      h("button", { class: "cta verde", onclick: () => montar(rk, volta) }, todas.length > MAX ? "Jogar de novo (outras partes)" : "Jogar de novo"),
      todas.length > MAX ? h("button", { class: "cta", onclick: () => montar(rk, volta, todas) }, `Desafio: todas as ${todas.length} partes`) : null,
      h("button", { class: "big", style: "justify-content:center", onclick: () => estudar(rk, volta) }, "👀 Estudar o mapa"),
      h("button", { class: "big", style: "justify-content:center", onclick: volta }, "Voltar")));
  }
  tela(topo(`🧩 ${r.rotulo}`, "Arraste o nome até o ponto (ou toque no nome e depois no ponto)", volta),
    h("div", { class: "hud" }, h("span", {}, "⏱ ", hudT), h("span", {}, "✅ ", hudA), h("span", {}, "❌ ", hudE)),
    pal.el, h("div", { class: "chips" }, chips));
  pal.montar(); pal.inteiro();
  E.rod++; salvar();
  relogio = setInterval(() => (hudT.textContent = Math.round((Date.now() - t0) / 1000) + "s"), 1000);
}

// ---------- RELÂMPAGO 60s ----------
function relampago() {
  E.rod++;
  let pontos = 0, fimEm = Date.now() + 60000, fila = embaralha(PARTES), idx = 0, travado = false;
  const placar = h("b", {}, "0"), tempo = h("b", {}, "60s"), barra = h("i", { style: "width:100%" });
  const corpo = h("div");
  function prox() {
    if (idx >= fila.length) { fila = embaralha(PARTES); idx = 0; }
    const p = fila[idx++], pal = Palco(p.reg, alturaZoom);
    pal.add(h("div", { class: "alvo" }), p.hot);
    const btns = opcoes(p).map((o) => h("button", { class: "op", onclick: () => {
      if (travado) return; travado = true;
      const certo = o === p.nome; registra(p.id, certo);
      btns.forEach((b) => { if (b.textContent === p.nome) b.classList.add("ok"); else if (b.textContent === o) b.classList.add("bad"); });
      if (certo) { pontos++; placar.textContent = pontos; bip("ok"); } else { bip("erro"); fimEm -= 3000; }
      setTimeout(() => { travado = false; if (Date.now() < fimEm) prox(); }, certo ? 350 : 1100);
    } }, o));
    corpo.replaceChildren(pal.el, h("div", { class: "qtxt" }, p.osso ? "Que osso é esse?" : "Que parte é essa?"), h("div", { class: "ops" }, btns));
    pal.montar(); pal.semAnim(() => pal.focar(p.hot));
  }
  tela(topo("⚡ Relâmpago", "Errou = perde 3 segundos"), h("div", { class: "hud" }, h("span", {}, "⏱ ", tempo), h("span", {}, "Pontos: ", placar)),
    h("div", { class: "timer" }, barra), corpo);
  prox();
  relogio = setInterval(() => {
    const rest = Math.max(0, Math.ceil((fimEm - Date.now()) / 1000));
    tempo.textContent = rest + "s"; barra.style.width = (rest / 60) * 100 + "%";
    if (rest <= 0) {
      clearInterval(relogio); relogio = null;
      const rec = pontos > (E.best.rel || 0); if (rec) E.best.rel = pontos; salvar();
      bip("fim"); if (rec && pontos > 0) confete();
      tela(h("div", { class: "res" }, h("div", { class: "estrelas" }, "⚡"), h("h2", {}, `${pontos} ponto${pontos === 1 ? "" : "s"}`),
        h("p", {}, rec ? "🏆 Novo recorde!" : `Seu recorde: ${E.best.rel}`),
        h("button", { class: "cta verde", onclick: relampago }, "Tentar de novo"),
        h("button", { class: "big", style: "justify-content:center", onclick: inicio }, "Início")));
    }
  }, 250);
}

inicio();
</script></body></html>
